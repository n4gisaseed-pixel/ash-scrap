(()=>{'use strict';const KEY='hakonoko-save-v2';const OLD_KEY='hakonoko-save-v1';const missions=[{name:'宝箱、勇者を食う。',goal:'敵をすべて撃退せよ',intro:'薄暗い遺跡。勇者は青白い魔石を宝箱に押し込んだ。\n\n勇者「ここに隠せば安全だ！」\nミミック「……ガブッ」\n勇者「待て！ それは宝箱じゃ――」\n\n眩い光。気がつくと、そこには角の生えた少年が立っていた。\n\nハコ「手だ！ 足もある！ 走れる！！ すげえ！！」\nハコ「……よし。今までオレの宝を盗んだ奴ら、仕返ししてやる！」',end:'勇者の追っ手を追い払ったハコ。\n「宝箱だった頃は、誰かが来るのを待つだけだった。今度はオレが行く！」'},{name:'手足が生えた日',goal:'敵をすべて撃退せよ',intro:'はじめての町。ハコは市場の果物を飲み込んで大騒ぎに。\nルルカ「ちょっと！ お金を払わなきゃダメでしょ！」\nハコ「えっ、宝箱の中身って勝手に取っていいんじゃないのか！？」\nその時、魔核を探す賞金稼ぎが現れる。',end:'ルルカ「あなた、ほんっとに世間知らずね」\nハコ「うるせー！ でも、助かった。ありがとな！」'},{name:'宝箱泥棒を許すな！',goal:'敵をすべて撃退せよ',intro:'冒険者がダンジョンから運び出した荷車を発見。\nハコ「それ、オレの部屋にあったやつ！！」\nルルカ「……あんたの部屋、ダンジョンでしょ？」',end:'荷車から古い宝物を取り戻した。だが、勇者の手配書にはハコの似顔絵が描かれていた。'}];const jobs={fighter:{name:'ファイター',icon:'⚔️',atk:2,range:1},thief:{name:'シーフ',icon:'🗡️',atk:0,range:1},mage:{name:'黒魔導士',icon:'🔮',atk:1,range:2}};const base=[{id:'h',name:'ハコ',icon:'😈',team:'ally',max:26,atk:8,move:3,x:1,y:6},{id:'l',name:'ルルカ',icon:'🧙',team:'ally',max:21,atk:6,move:3,x:0,y:7}];let state,units,selected=null,mode='select',turn=1,phase='ally',logs=[];const $=id=>document.getElementById(id),rand=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y),cell=(x,y)=>y*8+x,terrain=['........','..#.....','...#..~.','......~.','.#......','....#...','........','........'];function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){log('セーブできませんでした')}}function init(){let stored=null;try{stored=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLD_KEY)||'null')}catch(e){}state=stored&&Number.isInteger(stored.chapter)&&stored.chapter>=0&&stored.chapter<=missions.length?stored:{chapter:0,job:'fighter',xp:0,lv:1,learn:{fire:0},learned:[],cleared:[]};if(!jobs[state.job])state.job='fighter';if(!Number.isInteger(state.lv)||state.lv<1||state.lv>99)state.lv=1;if(!Number.isFinite(state.xp)||state.xp<0||state.xp>=30)state.xp=0;if(!state.learn||typeof state.learn!=='object')state.learn={fire:0};if(!Array.isArray(state.learned))state.learned=[];startMission(false)}function startMission(show=true){selected=null;mode='select';phase='ally';turn=1;logs=[];const ch=Math.min(state.chapter,missions.length-1);units=base.map((u,i)=>({...u,max:u.max+(u.id==='h'?3*(state.lv-1):0),atk:u.atk+(u.id==='h'?state.lv-1:0),hp:u.max+(u.id==='h'?3*(state.lv-1):0),acted:false,moved:false,x:u.x+(ch===2?1:0),y:u.y}));let enemies=[{x:6,y:1},{x:5,y:3},{x:7,y:5}];if(ch===1)enemies=[{x:6,y:1},{x:6,y:4},{x:4,y:2}];if(ch===2)enemies=[{x:6,y:1},{x:5,y:3},{x:7,y:4},{x:3,y:1}];enemies.forEach((p,i)=>units.push({id:'e'+i,name:i===0?'炎蜥蜴':'冒険者',icon:i===0?'🦎':'🛡️',team:'enemy',max:i===0?19:16,hp:i===0?19:16,atk:5+(ch===2?1:0),move:2,x:p.x,y:p.y,acted:false,fire:i===0}));log('第'+(ch+1)+'話 開始！');render();if(show)modal('第'+(ch+1)+'話 '+missions[ch].name,missions[ch].intro,'出撃！',()=>{});else if(state.chapter===0)modal('ハコノコ',missions[0].intro,'冒険を始める',()=>{})}function log(s){logs.unshift(s);logs=logs.slice(0,24);$('log').innerHTML=logs.map(x=>'<div>'+escapeHtml(x)+'</div>').join('')}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function walkable(x,y){return x>=0&&x<8&&y>=0&&y<8&&terrain[y][x]!== '#'&&terrain[y][x]!=='~'&&!units.some(u=>u.hp>0&&u.x===x&&u.y===y)}function actor(){return units.find(u=>u.id===selected&&u.hp>0)}function render(){const ch=Math.min(state.chapter,missions.length-1);$('mission').textContent='第'+(ch+1)+'話：'+missions[ch].name;$('goal').textContent=missions[ch].goal+' ｜ TURN '+turn+' ｜ '+(phase==='ally'?'味方フェイズ':'敵フェイズ');$('storyText').textContent=missions[ch].intro+'\n\n'+(state.chapter>0?'これまでにクリアした依頼：'+state.chapter+'件':'');const a=actor();$('map').innerHTML='';for(let y=0;y<8;y++)for(let x=0;x<8;x++){const u=units.find(t=>t.hp>0&&t.x===x&&t.y===y);let b=document.createElement('button');b.className='tile '+(terrain[y][x]==='#'?'wall':terrain[y][x]==='~'?'water':'')+(a&&a.x===x&&a.y===y?' selected':'')+(mode==='move'&&a&&!a.moved&&rand(a,{x,y})<=a.move&&walkable(x,y)?' move':'')+(mode==='attack'&&a&&u&&u.team==='enemy'&&rand(a,u)<=range(a)?' target':'');b.textContent=u?u.icon:terrain[y][x]==='#'?'🪨':terrain[y][x]==='~'?'≈':'';b.setAttribute('aria-label',u?u.name+' HP'+u.hp:'座標'+x+','+y);if(u){let s=document.createElement('span');s.className='hp';s.textContent=u.hp;b.append(s)}b.onclick=()=>tap(x,y);$('map').append(b)}$('stats').innerHTML=units.filter(u=>u.team==='ally').map(u=>'<div class="stat"><span>'+u.icon+' '+u.name+(u.acted?' ✓':'')+'</span><span>HP '+Math.max(0,u.hp)+'/'+u.max+'</span></div>').join('')+'<div class="stat"><span>ハコのジョブ</span><span>'+jobs[state.job].name+'</span></div><div class="stat"><span>レベル</span><span>'+state.lv+' (EXP '+state.xp+'/30)</span></div>';$('learning').innerHTML='<div class="stat"><span>🔥 フレイムブレス</span><span>'+(state.learned.includes('fire')?'習得済み':(state.learn.fire||0)+'/100')+'</span></div>';$('partyInfo').innerHTML=units.filter(u=>u.team==='ally').map(u=>'<p>'+u.icon+' '+u.name+'　HP '+Math.max(0,u.hp)+' / '+u.max+'</p>').join('');$('jobs').innerHTML=Object.entries(jobs).map(([k,v])=>'<span class="job"><button data-job="'+k+'" '+(state.job===k?'class="active"':'')+'>'+v.icon+' '+v.name+'</button></span>').join('');document.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>{if(phase!=='ally')return;state.job=b.dataset.job;save();log('ジョブ変更：'+jobs[state.job].name);render()});$('hint').textContent=a?a.name+'を選択中。'+(a.acted?'行動済み':mode==='move'?'青枠のマスへ移動':mode==='attack'?'赤枠の敵を攻撃':'行動を選んでください'):'味方ユニットをタップして選択';for(const id of ['move','attack','skill','wait'])$(id).disabled=!a||a.acted||phase!=='ally';$('move').disabled=$('move').disabled||!!(a&&a.moved)}function range(u){return u.id==='h'?jobs[state.job].range:2}function tap(x,y){if(phase!=='ally')return;const u=units.find(t=>t.hp>0&&t.x===x&&t.y===y),a=actor();if(mode==='move'&&a&&!a.acted&&!a.moved&&rand(a,{x,y})<=a.move&&walkable(x,y)){a.x=x;a.y=y;a.moved=true;log(a.name+'が移動');mode='select';render();check();return}if(mode==='attack'&&a&&!a.acted&&u&&u.team==='enemy'&&rand(a,u)<=range(a)){hit(a,u);a.acted=true;selected=null;mode='select';render();check();return}if(u&&u.team==='ally'&&!u.acted){selected=u.id;mode='select';render()}else if(u){log(u.name+' HP '+u.hp+'/'+u.max)}}function hit(a,b,skill=false){let dmg=Math.max(2,a.atk+(a.id==='h'?jobs[state.job].atk:0)+(skill?3:0)-Math.floor(Math.random()*3));b.hp=Math.max(0,b.hp-dmg);log(a.name+' → '+b.name+' に '+dmg+' ダメージ！');if(b.fire&&a.id==='h'&&!state.learned.includes('fire'))learn(35);if(b.hp===0)log(b.name+'を撃退！')}function learn(n){state.learn.fire=Math.min(100,(state.learn.fire||0)+n);if(state.learn.fire>=100&&!state.learned.includes('fire')){state.learned.push('fire');log('★ フレイムブレスをラーニング！')}save()}function check(){if(units.filter(u=>u.team==='enemy').every(u=>u.hp===0)){const ch=state.chapter;state.chapter=Math.min(missions.length,state.chapter+1);state.xp+=15;if(state.xp>=30){state.xp-=30;state.lv++}save();modal('任務達成！',missions[Math.min(ch,missions.length-1)].end+'\n\nEXP +15'+(state.chapter>=missions.length?'\n\n第一部・体験版クリア！':''),state.chapter>=missions.length?'クリア記録を見る':'次の話へ',()=>{if(state.chapter>=missions.length){modal('体験版クリア！','第一部の3話をクリアしました。ジョブとラーニングの記録は保存されています。最初から遊ぶ場合は「最初から」を選んでください。','続ける',()=>startMission(false));return}startMission(true)});return}if(units.filter(u=>u.team==='ally').every(u=>u.hp===0))modal('敗北','ハコ「くっそー！ 次こそ仕返ししてやる！」','再挑戦',()=>startMission(false))}function enemyTurn(){if(phase!=='ally')return;phase='enemy';selected=null;mode='select';for(const e of units.filter(u=>u.team==='enemy'&&u.hp>0)){const targets=units.filter(u=>u.team==='ally'&&u.hp>0).sort((a,b)=>rand(e,a)-rand(e,b));if(!targets.length)break;let t=targets[0];if(rand(e,t)<=1){hit(e,t);if(e.fire&&t.id==='h'&&!state.learned.includes('fire'))learn(30)}else{let candidates=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>({x:e.x+dx,y:e.y+dy})).filter(p=>walkable(p.x,p.y)).sort((a,b)=>rand(a,t)-rand(b,t));if(candidates.length&&rand(candidates[0],t)<rand(e,t)){e.x=candidates[0].x;e.y=candidates[0].y;log(e.name+'が接近')}}}turn++;phase='ally';units.forEach(u=>{u.acted=false;u.moved=false});render();check()}function modal(title,msg,button,cb){$('modalTitle').textContent=title;$('modalText').textContent=msg;$('modalOk').textContent=button;$('overlay').classList.add('show');$('modalOk').onclick=()=>{$('overlay').classList.remove('show');cb&&cb()}}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(t=>t.classList.toggle('active',t===b));document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===b.dataset.tab))});$('move').onclick=()=>{const a=actor();if(a&&!a.moved){mode='move';render()}else log('このターンは移動済みです')};$('attack').onclick=()=>{mode='attack';render()};$('wait').onclick=()=>{const a=actor();if(a){a.acted=true;selected=null;log(a.name+'は待機');render()}};$('skill').onclick=()=>{const a=actor();if(!a)return;if(a.id==='h'&&state.learned.includes('fire')){let e=units.filter(u=>u.team==='enemy'&&u.hp>0&&rand(a,u)<=3).sort((x,y)=>rand(a,x)-rand(a,y))[0];if(e){hit(a,e,true);a.acted=true;selected=null;render();check()}else log('射程3以内に敵がいません')}else if(a.id==='h'){const e=units.find(u=>u.team==='enemy'&&u.fire&&u.hp>0);if(e&&rand(a,e)<=3){learn(45);a.acted=true;selected=null;log('ハコは炎蜥蜴を観察した');render()}else log('解析できる魔物が近くにいません')}else log('ルルカの技は今後のアップデートで追加予定')};$('end').onclick=enemyTurn;$('reset').onclick=()=>modal('冒険をやり直す？','保存した進行状況を消して第1話から始めます。','リセットする',()=>{localStorage.removeItem(KEY);init()});$('nextStory').onclick=()=>modal('ハコノコ',missions[Math.min(state.chapter,missions.length-1)].intro,'閉じる',()=>{});init()})();
