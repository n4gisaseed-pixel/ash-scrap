const missions=[
['宝箱、勇者を食う。','原初の魔核を誤飲。手足を得たハコは、勇者の追っ手から逃げ出す。','勇者「絶対に飲み込むな！」\nミミック「……ガブッ」\n\nまばゆい光のあと、宝箱のいた場所に角の生えた少年が立っていた。\nハコ「手がある！ 足も動く！ すげえ！ ……よし、冒険者に仕返しだ！」','「オレはもう、待ってるだけの箱じゃねえ！」','defeat'],
['手足が生えた日','初めての市場でルルカと遭遇。賞金稼ぎを退けよう。','ハコ「宝箱の中身は勝手に取っていいんだろ？」\nルルカ「商品はダメ！ お金を払うの！」\nそこへ魔核を追う賞金稼ぎが現れた。','ルルカ「放っておけないわね……ついてきなさい！」','defeat'],

['勇者の手配書','ハコの手配書を見た追っ手が押し寄せる。','ハコ「もっとカッコよく描けよ！」\nルルカ「そこを怒るの！？」','ハコは手配書を破り捨てた。','defeat'],

['魔物だって怒るんだ','森の魔物たちを守り抜け。','魔物狩りの一団が森に踏み込んだ。\nハコ「オレの仲間に手を出すな！」','ガルム「面白い小僧だ。俺も行こう」','survive'],

function tap(x,y){if(phase!=='ally'||finished)return;let u=units.find(t=>t.hp>0&&t.x===x&&t.y===y),a=actor();if(mode==='move'&&a&&!a.moved&&reachable(a).has(idx(x,y))&&!occupied(x,y,a)){lastMove={id:a.id,x:a.x,y:a.y};a.x=x;a.y=y;a.moved=true;mode='select';log(a.name+'が移動');render();check();return}if(mode==='attack'&&a&&!a.acted&&u&&u.team==='enemy'&&dist(a,u)<=range(a)){hit(a,u);finish(a);return}if(mode==='skilltarget'&&a&&!a.acted&&u&&dist(a,u)<=skills[targetSkill].range&&((targetSkill==='heal'&&u.team==='ally')||(targetSkill!=='heal'&&u.team==='enemy'))){useSkill(a,u,targetSkill);finish(a);return}if(u&&u.team==='ally'&&!u.acted){selected=u.id;mode='select';render()}else if(u)log(u.name+' HP '+u.hp+'/'+u.max)}

function check(){if(finished)return;const ch=Math.min(state.chapter,11),objective=missions[ch].objective,alive=units.filter(u=>u.team==='enemy'&&u.hp>0),allies=units.filter(u=>u.team==='ally'&&u.hp>0),h=units.find(u=>u.id==='h');if(!allies.length||h.hp<=0||(objective==='protect'&&units.find(u=>u.id==='s')?.hp<=0)){finished=true;modal('敗北','ハコ「くっそー！ 次は負けねえ！」','再挑戦',()=>startMission(false));return}let won=!alive.length||(objective==='seize'&&h.x===7&&h.y===7)||(objective==='survive'&&turn>4+Math.floor(ch/4));if(!won)return;finished=true;let first=!state.cleared.includes(ch);if(first){state.cleared.push(ch);state.gold+=90+ch*20;state.potions=Math.min(99,state.potions+1)}state.chapter=Math.max(state.chapter,Math.min(missions.length,ch+1));state.xp+=18;if(state.xp>=30&&state.lv<99){state.xp-=30;state.lv++;log('ハコがレベルアップ！')}save();modal('任務達成！',missions[ch].end+'\n\nEXP +18 / '+(first?'報酬 '+(90+ch*20)+'G・ポーション+1':'再挑戦クリア')+(state.chapter>=12?'\n\n第一部 全12話クリア！':''),state.chapter>=12?'クリア後も遊ぶ':'次の話へ',()=>startMission(true))}
function enemyTurn(){if(phase!=='ally'||finished)return;lastMove=null;phase='enemy';selected=null;mode='select';for(const e of units.filter(u=>u.team==='enemy'&&u.hp>0)){let allies=units.filter(u=>u.team==='ally'&&u.hp>0);if(!allies.length)break;allies.sort((a,b)=>dist(e,a)-dist(e,b));let t=allies[0];if(dist(e,t)>1){const q=[{x:e.x,y:e.y,d:0}],seen=new Set([idx(e.x,e.y)]),options=[];for(let i=0;i<q.length;i++){let p=q[i];if(p.d>0)options.push(p);if(p.d>=e.move)continue;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let x=p.x+dx,y=p.y+dy,k=idx(x,y);if(valid(x,y)&&!occupied(x,y,e)&&!seen.has(k)){seen.add(k);q.push({x,y,d:p.d+1})}}}options.sort((a,b)=>dist(a,t)-dist(b,t));if(options.length&&dist(options[0],t)<dist(e,t)){e.x=options[0].x;e.y=options[0].y;log(e.name+'が接近')}}allies=units.filter(u=>u.team==='ally'&&u.hp>0);allies.sort((a,b)=>dist(e,a)-dist(e,b));t=allies[0];if(t&&dist(e,t)<=1)hit(e,t)}turn++;phase='ally';units.forEach(u=>{u.acted=false;u.moved=false;u.defend=false});render();check()}

function chooseSkill(){let a=actor();if(!a)return;
 if(a.id!=='h'){if(a.id==='l'||a.id==='v'){let ally=units.filter(u=>u.team==='ally'&&u.hp>0&&u.hp<u.max&&dist(a,u)<=3).sort((x,y)=>(x.hp/x.max)-(y.hp/y.max))[0];if(ally){ally.hp=Math.min(ally.max,ally.hp+12);log(a.name+'が'+ally.name+'を回復');finish(a)}else log('射程内に回復できる味方がいません')}else{a.defend=true;log(a.name+'は防御態勢をとった');finish(a)}return}
 skillPicker(a)
}
function undoMove(){let a=actor();if(!a||!lastMove||a.id!==lastMove.id||a.acted||!a.moved){log('戻せる移動がありません');return}if(occupied(lastMove.x,lastMove.y,a)){log('元の場所に戻れません');return}a.x=lastMove.x;a.y=lastMove.y;a.moved=false;lastMove=null;mode='select';log(a.name+'の移動を取り消した');render()}
function threatAt(x,y){return units.some(e=>e.team==='enemy'&&e.hp>0&&dist(e,{x,y})<=e.move+1)}
function syncMapSize(){const map=$('map');if(!map)return;const section=$('battle');if(!section||!section.classList.contains('on'))return;const r=section.getBoundingClientRect();const actions=document.querySelector('.actions');const reserved=(actions?.getBoundingClientRect().height||44)+85;const available=Math.max(110,r.height-reserved);const w=Math.min(r.width-4,available,530);map.style.width=Math.floor(w)+'px'}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(t=>t.classList.toggle('active',t===b));document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===b.dataset.tab))});$('undoMove').onclick=undoMove;$('toggleThreat').onclick=()=>{showThreat=!showThreat;render()};$('abilityCancel').onclick=closeAbility;window.addEventListener('resize',()=>requestAnimationFrame(syncMapSize));$('move').onclick=()=>{let a=actor();if(a&&!a.moved){mode='move';render()}};$('attack').onclick=()=>{mode='attack';render()};$('skill').onclick=chooseSkill;$('wait').onclick=()=>{let a=actor();if(a){log(a.name+'は待機');finish(a)}};$('end').onclick=enemyTurn;$('reset').onclick=()=>modal('最初から遊びますか？','セーブデータを削除し、第一話に戻ります。','リセットする',()=>{for(const k of [KEY,...PREV])localStorage.removeItem(k);init()});$('nextStory').onclick=()=>modal('第'+(Math.min(state.chapter,11)+1)+'話',missions[Math.min(state.chapter,11)].intro,'閉じる',()=>{});init();
})();

</script></html>
